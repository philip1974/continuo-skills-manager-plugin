name: CI

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        # Windows omitted for v0.1: plan-04 §3.4 #4 acknowledges Windows as
        # degraded (no persistent cache, mode bits cosmetic). Full Windows
        # unit-test parity (path separators, time/clock differences) deferred
        # to v0.2. cross-os-hash.yml still tests Windows for canonical tree
        # hash determinism, which IS in scope.
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Web-compat gate (sandboxed renderer)
        run: pnpm check:web-compat
      - name: Build (esbuild + bundle gate)
        run: pnpm build
      - name: Bundle metafile assertion
        run: |
          node -e "const m=require('./dist/main.js.meta.json'); const o=m.outputs['dist/main.js']; const ALLOWED_HOST=new Set(['react','react-dom','zod','react/jsx-runtime','react/jsx-dev-runtime']); const isNode=p=>p.startsWith('node:'); const forbidden=o.imports.filter(i=>!ALLOWED_HOST.has(i.path)&&!isNode(i.path)); if(forbidden.length){console.error('forbidden externals:',forbidden);process.exit(1)} console.log('CI bundle gate OK -',o.imports.length,'allowed externals')"
      - name: Trust gates (ts-morph)
        run: bash tools/check-trust-gates.sh
        if: matrix.os != 'windows-latest'  # bash script; Windows runs via WSL or skip - TBD per Op8
